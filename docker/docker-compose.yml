# Local development stack: PostgreSQL + Redis (+ optional backend container).
#   docker compose -f docker/docker-compose.yml up -d postgres redis
name: socialapp

services:
  postgres:
    image: postgres:16-alpine
    container_name: socialapp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: socialapp
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: socialapp-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  # Optional: run the production backend image locally (mirrors Railway).
  server:
    profiles: ["server"]
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: socialapp-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/socialapp?schema=public
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: local-development-secret-change-me-32-chars
      CORS_ORIGINS: "*"
      LOG_LEVEL: debug
    ports:
      - "3000:3000"

volumes:
  postgres-data:
  redis-data:
