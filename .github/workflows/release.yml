name: Release

# Produces the installable Windows .exe and attaches it to a GitHub Release.
#
# Triggers:
#   * manual                -> Actions > Release > "Run workflow" (green button)
#   * push a tag            -> git tag v1.0.0 && git push origin v1.0.0
#   * push a release branch -> git push origin HEAD:release/v1.0.0
#
# The Windows client is the deliverable, so nothing else may block it:
# publishing depends on the desktop build alone.
on:
  push:
    tags:
      - "v*"
    branches:
      - "release/**"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (empty = version from package.json)"
        required: false
        default: ""

permissions:
  contents: write

# A second push must not race the first run for the same tag.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      # Never fails: an unusable ref falls back to the monorepo version, so
      # "Run workflow" works from any branch without filling in the input.
      - id: resolve
        shell: bash
        run: |
          set -euo pipefail
          FALLBACK="$(node -p "require('./package.json').version")"
          INPUT="${{ github.event.inputs.version }}"
          if [ -n "$INPUT" ]; then
            VERSION="$INPUT"; SOURCE="workflow input"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="$GITHUB_REF_NAME"; SOURCE="tag"
          elif [[ "$GITHUB_REF_NAME" == release/* ]]; then
            VERSION="${GITHUB_REF_NAME#release/}"; SOURCE="release branch"
          else
            VERSION="$FALLBACK"; SOURCE="package.json"
          fi
          VERSION="${VERSION#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.0-9A-Za-z]*)$ ]]; then
            echo "::warning::'$VERSION' (from $SOURCE) is not semver - falling back to $FALLBACK"
            VERSION="$FALLBACK"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing $VERSION (tag v$VERSION), resolved from $SOURCE"

  desktop:
    name: Build Windows desktop client (.exe)
    needs: version
    runs-on: windows-latest
    env:
      # Optional override: Settings > Secrets and variables > Actions > Variables
      #   SOCIALAPP_API_URL = https://<service>.up.railway.app
      # When unset, the production default compiled into the build config is used.
      SOCIALAPP_API_URL: ${{ vars.SOCIALAPP_API_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set version ${{ needs.version.outputs.version }}
        run: node scripts/set-version.mjs "${{ needs.version.outputs.version }}"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build shared packages
        run: npm run build:packages

      - name: Build renderer + electron main process
        run: npm run build -w @socialapp/desktop

      - name: Package Windows installer + portable executable
        run: npm run pack:win -w @socialapp/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Diagnostics only: it must never turn a build failure into a confusing
      # "path does not exist" error that hides the real one.
      - name: List produced artifacts
        if: always()
        continue-on-error: true
        shell: pwsh
        run: Get-ChildItem apps/desktop/release -File -ErrorAction SilentlyContinue | Select-Object Name, Length

      - name: Verify installer and portable .exe exist
        shell: pwsh
        run: |
          $version = "${{ needs.version.outputs.version }}"
          $setup = "apps/desktop/release/SocialApp-Setup-$version.exe"
          $portable = "apps/desktop/release/SocialApp-Portable-$version.exe"
          if (!(Test-Path $setup)) { throw "missing installer: $setup" }
          if (!(Test-Path $portable)) { throw "missing portable build: $portable" }
          Write-Host "OK installer:  $((Get-Item $setup).Length) bytes"
          Write-Host "OK portable:   $((Get-Item $portable).Length) bytes"

      # electron-builder does not always emit latest.yml when it is invoked with
      # --publish never, and electron-updater needs that manifest. Write a valid
      # one ourselves so future in-app updates keep working.
      - name: Ensure latest.yml exists (electron-updater manifest)
        shell: pwsh
        run: |
          $version = "${{ needs.version.outputs.version }}"
          $dir = "apps/desktop/release"
          $manifest = Join-Path $dir "latest.yml"
          if (Test-Path $manifest) {
            Write-Host "latest.yml generated by electron-builder - keeping it"
            Get-Content $manifest
            exit 0
          }
          $setupName = "SocialApp-Setup-$version.exe"
          $setup = Join-Path $dir $setupName
          $sha = [System.Security.Cryptography.SHA512]::Create().ComputeHash(
            [System.IO.File]::ReadAllBytes($setup))
          $sha512 = [Convert]::ToBase64String($sha)
          $size = (Get-Item $setup).Length
          $date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ss.fffZ")
          @(
            "version: $version",
            "files:",
            "  - url: $setupName",
            "    sha512: $sha512",
            "    size: $size",
            "path: $setupName",
            "sha512: $sha512",
            "releaseDate: '$date'"
          ) | Set-Content -Path $manifest -Encoding utf8
          Write-Host "wrote fallback $manifest"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-desktop
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest.yml
          if-no-files-found: error
          retention-days: 30

  # Nice to have, never a blocker: Railway builds and runs the real server.
  backend:
    name: Build backend bundle
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set version ${{ needs.version.outputs.version }}
        run: node scripts/set-version.mjs "${{ needs.version.outputs.version }}"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build shared packages
        run: npm run build:packages

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Build backend
        run: npm run build -w @socialapp/server

      - name: Build production Docker image (same image Railway builds)
        continue-on-error: true
        run: docker build -f docker/Dockerfile -t socialapp-server:${{ needs.version.outputs.version }} .

      - name: Create backend bundle
        run: |
          mkdir -p artifacts
          tar -czf "artifacts/socialapp-server-${{ needs.version.outputs.version }}.tar.gz" \
            apps/server/dist apps/server/prisma apps/server/package.json \
            packages/shared/dist packages/shared/package.json \
            package.json docker/Dockerfile railway.json

      - uses: actions/upload-artifact@v4
        with:
          name: backend-bundle
          path: artifacts/*
          retention-days: 14

  publish:
    name: Publish GitHub Release
    needs: [version, desktop]
    runs-on: ubuntu-latest
    steps:
      # Downloads every artifact the run produced. A missing backend bundle is
      # fine - the Windows client is what matters here.
      - uses: actions/download-artifact@v4
        with:
          path: dist-artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p release
          find dist-artifacts -type f -exec cp {} release/ \;
          ls -la release

      - name: Verify the installer made it here
        run: |
          setup="release/SocialApp-Setup-${{ needs.version.outputs.version }}.exe"
          if [ ! -f "$setup" ]; then
            echo "::error::$setup is missing - nothing to publish"
            exit 1
          fi
          echo "installer: $(du -h "$setup" | cut -f1)"

      - name: Create / update GitHub Release ${{ needs.version.outputs.tag }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: SocialApp ${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          # Globs only, and a missing optional asset must never abort publishing.
          fail_on_unmatched_files: false
          files: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
            release/*.tar.gz
          body: |
            ## SocialApp ${{ needs.version.outputs.version }}

            **Windows desktop client**

            | File | Description |
            | --- | --- |
            | `SocialApp-Setup-${{ needs.version.outputs.version }}.exe` | Installer (Start Menu + desktop shortcut, uninstall support) |
            | `SocialApp-Portable-${{ needs.version.outputs.version }}.exe` | Portable build, no installation required |

            Windows SmartScreen will warn about an unknown publisher because
            these builds are not code-signed: **More info -> Run anyway**.

            The desktop app is a **pure client** - it never starts a local
            backend. It talks to the Railway API over HTTPS. The production API
            URL is compiled into the build and can be changed at any time in
            **Settings > Server**.

            **Backend** - `socialapp-server-${{ needs.version.outputs.version }}.tar.gz`
            contains the compiled API, Prisma schema and migrations. Deploy it to
            Railway with `docker/Dockerfile` (see `docs/RAILWAY.md`).
